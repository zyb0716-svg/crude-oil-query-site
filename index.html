<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>原油基本性质查询</title>
    <link rel="stylesheet" href="./styles.css?v=20260518-3">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">油</span><div><h1>原油基本性质查询</h1><p id="datasetMeta">进口原油基本性质数据</p></div></div>
        <div class="top-stats" aria-label="数据概览"><span><strong id="totalCount">0</strong> 油种</span><span><strong>15</strong> 字段</span></div>
      </header>
      <main class="workspace">
        <section class="query-panel" aria-labelledby="queryTitle">
          <div class="panel-head"><h2 id="queryTitle">油种检索</h2><button class="ghost-button" id="resetButton" type="button">重置</button></div>
          <div class="searchbar"><label class="sr-only" for="searchInput">油种名称</label><input id="searchInput" type="search" placeholder="输入中文或英文油种" autocomplete="off"><button class="icon-button" id="clearButton" type="button" title="清空搜索" aria-label="清空搜索">×</button></div>
          <div class="filters" aria-label="筛选"><label><span>类别</span><select id="classFilter"></select></label><label><span>产地</span><select id="originFilter"></select></label></div>
          <div class="result-meta"><span id="resultCount">0 条结果</span><span id="activeMatch">按相关度排序</span></div>
          <div class="table-wrap" role="region" aria-label="油种结果列表" tabindex="0"><table><thead><tr><th>油种</th><th>产地</th><th>API°</th><th>硫含量</th><th>类别</th></tr></thead><tbody id="resultBody"></tbody></table></div>
        </section>
        <aside class="detail-panel" id="detailPanel" aria-live="polite"></aside>
      </main>
    </div>
    <script src="./assets/row-b64/data-0.js?v=20260518-4"></script>
    <script src="./assets/row-b64/data-1.js?v=20260518-4"></script>
    <script src="./assets/row-b64/data-2.js?v=20260518-4"></script>
    <script src="./assets/row-b64/data-3.js?v=20260518-4"></script>
    <script src="./assets/row-b64/data-4.js?v=20260518-4"></script>
    <script src="./assets/row-b64/assemble.js?v=20260518-4"></script>
    <script src="./app.js?v=20260518-4"></script>
  </body>
</html>
